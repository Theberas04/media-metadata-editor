name: Windows build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tests -v
          python -m compileall -q mediameta main.py tools

      - name: Build Windows app
        shell: pwsh
        run: |
          cmd /c build_windows.bat
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed with exit code $LASTEXITCODE" }

      - name: Verify package contents and Qt multimedia plugins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'dist\Media Metadata Editor'
          $exe  = Join-Path $root 'Media Metadata Editor.exe'
          if (!(Test-Path $exe)) { throw "Build did not produce the executable" }
          if ((Get-Item $exe).Length -lt 100000) { throw "Executable is suspiciously small" }
          foreach ($pattern in @('qtaudio_windows.dll', 'dsengine.dll', 'wmfengine.dll')) {
            $found = Get-ChildItem -Path $root -Recurse -Filter $pattern -ErrorAction SilentlyContinue
            if (!$found) { Write-Host "::warning::plugin $pattern niet gevonden in de build" }
            else { Write-Host "plugin ok: $($found[0].FullName)" }
          }
          $audio = Get-ChildItem -Path $root -Recurse -Filter 'qtaudio_windows.dll' -ErrorAction SilentlyContinue
          if (!$audio) { throw "Qt audio-plugin ontbreekt: geluid zou niet werken" }
          $media = Get-ChildItem -Path $root -Recurse -Include 'dsengine.dll','wmfengine.dll' -ErrorAction SilentlyContinue
          if (!$media) { throw "Qt mediaservice-plugin ontbreekt: afspelen zou niet werken" }
          $logo = Get-ChildItem -Path $root -Recurse -Filter 'logo.png' -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*branding*' }
          if (!$logo) { throw "logo ontbreekt in de build" }
          Write-Host "logo ok: $($logo[0].FullName)"
          Get-ChildItem -Path $root -Recurse -Filter 'ffmpeg*.exe' | ForEach-Object { Write-Host "ffmpeg: $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: "Self-test 1: Qt-imports van de gebouwde exe"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\Media Metadata Editor\Media Metadata Editor.exe'
          $out = Join-Path $env:GITHUB_WORKSPACE 'imports.json'
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $env:MEDIA_META_HEADLESS = '1'
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest','--imports-only','--out',"`"$out`"" -PassThru
          if (-not $proc.WaitForExit(120000)) { $proc.Kill(); throw "import-test liep vast" }
          Write-Host "exitcode: $($proc.ExitCode)"
          if (Test-Path $out) { Get-Content $out -Raw | Write-Host }
          if ($proc.ExitCode -ne 0) { throw "De verpakte exe kan de Qt-modules niet importeren" }

      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\Media Metadata Editor\Media Metadata Editor.exe'
          $out = Join-Path $env:GITHUB_WORKSPACE 'selftest.json'
          Remove-Item $out -ErrorAction SilentlyContinue
          $env:MEDIA_META_HEADLESS = '1'
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest','--out',"`"$out`"" -PassThru
          if (-not $proc.WaitForExit(300000)) {
            Write-Host "proces reageert nog: $($proc.Responding), afgesloten: $($proc.HasExited)"
            Get-Process -Id $proc.Id -ErrorAction SilentlyContinue |
              Select-Object Id, ProcessName, Responding, CPU | Format-List
            $crash = Join-Path $env:GITHUB_WORKSPACE 'selftest.crash.log'
            if (Test-Path $crash) { Write-Host "--- faulthandler ---"; Get-Content $crash -Raw | Write-Host }
            $proc.Kill()
            if (Test-Path $out) { Get-Content $out -Raw | Write-Host }
            throw "De self-test van de gebouwde app liep vast"
          }
          Write-Host "exitcode: $($proc.ExitCode)"
          if (!(Test-Path $out)) { throw "De self-test schreef geen rapport" }
          Get-Content $out -Raw | Write-Host
          $report = Get-Content $out -Raw | ConvertFrom-Json
          if ($proc.ExitCode -ne 0) { throw "Self-test exitcode $($proc.ExitCode)" }
          if ($report.selftest -ne 'OK') { throw "Self-test niet OK" }
          if ($report.ui_save -ne $true) {
            Write-Host "::warning::De GUI-opslagweg is op deze runner niet gemeten (kern-schrijfactie is wel gecontroleerd)"
          }
          Copy-Item $out 'selftest-report.json' -Force

      - name: Package and verify distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'dist\Media Metadata Editor'
          $package = Join-Path $env:GITHUB_WORKSPACE 'MediaMetadataEditor-Windows.zip'
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $package -CompressionLevel Optimal -Force
          python -c "import sys,zipfile; p=sys.argv[1]; z=zipfile.ZipFile(p); assert z.testzip() is None; names=[n for n in z.namelist() if n.endswith('.exe')]; print('entries:', len(z.namelist())); print('exes:', names); assert any(n.endswith('Media Metadata Editor.exe') for n in names), 'exe ontbreekt'; print('size MB:', round(sum(i.file_size for i in z.infolist())/1048576,1))" $package

      - name: Write version.json for the updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content version.txt -Raw).Trim()
          $hash = (Get-FileHash MediaMetadataEditor-Windows.zip -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{
            version   = $version
            url       = "https://github.com/${{ github.repository }}/releases/latest/download/MediaMetadataEditor-Windows.zip"
            sha256    = $hash
            notes     = "Automatische build van $(Get-Date -Format 'yyyy-MM-dd') (commit ${{ github.sha }})."
          }
          $manifest | ConvertTo-Json | Set-Content -Path version.json -Encoding utf8
          Get-Content version.json
          Write-Host "sha256: $hash"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaMetadataEditor-Windows
          path: |
            MediaMetadataEditor-Windows.zip
            version.json
            version.txt
            selftest-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-${{ github.sha }}
          name: "Media Metadata Editor ${{ github.run_number }}"
          body: |
            Windows-build van commit `${{ github.sha }}`.
            Download `MediaMetadataEditor-Windows.zip`, pak uit en start
            `Media Metadata Editor.exe`. De app controleert zelf op updates.
          files: |
            MediaMetadataEditor-Windows.zip
            version.json
          make_latest: true
          fail_on_unmatched_files: true